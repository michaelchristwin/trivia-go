openapi: 3.1.0

info:
  title: Trivia API
  version: 1.0.0
  description: Backend system for trivia application

servers:
  - url: http://localhost:8080/api/v1
    description: Development Server
  
paths:
  /healthz: 
    get:
      operationId: getAppHealth
      summary: Get application health status
      responses:
        "200":
          description: Ok status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"

  /readyz:
    get:
      operationId: getAppReadiness
      summary: Get application readiness status to accept requests
      responses: 
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceReady"

        "503":
          description: Service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"



components:
  schemas:
    StatusOk:
      type: object
      required: [status]
      properties: 
        status:
         type: string

    ServiceReady:
      type: string
    
    ServiceUnavailable:
      type: string